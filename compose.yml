

services:
  db:
    image: postgres:15
    container_name: cargo-postgres
    environment:
      POSTGRES_DB: cargo_db
      POSTGRES_USER: cargo_user
      POSTGRES_PASSWORD: secret123
    networks:
      - cargo-network
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: cargo-django
    command: >
      bash -c "
      python manage.py migrate --settings=config.settings &&
      python manage.py runserver 0.0.0.0:8000 --settings=config.settings
      "
    environment:
      DB_HOST: db
      DB_NAME: cargo_db
      DB_USER: cargo_user
      DB_PASSWORD: secret123
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - cargo-network

networks:
  cargo-network:
    driver: bridge
