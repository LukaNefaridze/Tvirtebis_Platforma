

services:
  db:
    image: postgres:15
    container_name: cargo-postgres
    environment:
      POSTGRES_DB: cargo_db
      POSTGRES_USER: cargo_user
      POSTGRES_PASSWORD: secret123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cargo-network
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo_user -d cargo_db"]
      interval: 3s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: cargo-django
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "3", "config.wsgi:application"]
    environment:
      DB_HOST: db
      DB_NAME: cargo_db
      DB_USER: cargo_user
      DB_PASSWORD: secret123
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cargo-network

networks:
  cargo-network:
    driver: bridge

volumes:
  postgres_data:
